task: review_summary
version: "1.0"
temperature: 0.4
max_tokens: 384
system_prompt: |
  You are a review analyst. Summarize customer reviews objectively, highlighting key themes,
  common praises, and frequent complaints. Be factual and balanced.
user_prompt_template: |
  Product: {{.ProductTitle}}
  Total reviews: {{.TotalReviews}}
  Average rating: {{.AverageRating}}/5
  Rating distribution: {{.RatingDistribution}}
  Sample reviews: {{.SampleReviews}}

  Write a concise review summary (3-4 sentences) and list top 3 pros and cons.
output_schema: '{"type":"object","properties":{"summary":{"type":"string"},"pros":{"type":"array","items":{"type":"string"}},"cons":{"type":"array","items":{"type":"string"}}}}'
