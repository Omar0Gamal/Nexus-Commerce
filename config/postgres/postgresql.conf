# PostgreSQL configuration — tuned for a 12 GB container on 4 ARM cores
# Applied via: docker compose postgres command: postgres -c config_file=/etc/postgresql/postgresql.conf

# ─── Memory ──────────────────────────────────────────────────────────────────
# shared_buffers: 25% of container RAM (3 GB of 12 GB)
shared_buffers         = 3GB

# effective_cache_size: how much RAM the OS page cache + shared_buffers is
# estimated to hold — used by the query planner for cost estimates (75% of RAM).
effective_cache_size   = 9GB

# work_mem: per sort / hash-join operation. With max_connections=200 and normal
# query patterns this peaks well below total RAM.
work_mem               = 32MB

# maintenance_work_mem: used by VACUUM, ANALYZE, CREATE INDEX.
maintenance_work_mem   = 512MB

# ─── Write-Ahead Log ─────────────────────────────────────────────────────────
wal_buffers                  = 64MB
checkpoint_completion_target = 0.9
min_wal_size                 = 1GB
max_wal_size                 = 4GB

# ─── Connections ─────────────────────────────────────────────────────────────
# Each backend pool uses MaxConns=100. Headroom for migrations, admin tooling.
max_connections = 200

# ─── Parallelism (4 ARM cores) ───────────────────────────────────────────────
max_worker_processes             = 4
max_parallel_workers_per_gather  = 2
max_parallel_workers             = 4

# ─── I/O and Planner ─────────────────────────────────────────────────────────
# Oracle Cloud block storage has higher random_page_cost than local SSD.
random_page_cost = 2.0
effective_io_concurrency = 2

# ─── Logging ─────────────────────────────────────────────────────────────────
# Surface slow queries for profiling without flooding logs.
log_min_duration_statement = 500     # ms — log queries slower than this
log_checkpoints            = on
log_connections            = off
log_disconnections         = off
log_lock_waits             = on
