apiVersion: 1

groups:
  - orgId: 1
    name: nexus-alerts
    folder: Nexus Commerce
    interval: 1m
    rules:
      - uid: backend-5xx-rate
        title: HighBackend5xxRate
        condition: C
        for: 2m
        annotations:
          summary: "Backend 5xx error rate exceeds 5%"
          description: "Backend API 5xx error rate exceeded 5% for 2 minutes."
        labels:
          severity: critical
          team: backend
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: sum(rate(backend_requests_total{status_class="5xx"}[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: prometheus
            model:
              expr: sum(rate(backend_requests_total[5m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: math
              expression: "$A / $B > 0.05"

      - uid: analytics-dlq-growing
        title: AnalyticsDLQGrowing
        condition: A
        for: 5m
        annotations:
          summary: "Analytics DLQ depth exceeded 100"
          description: "Analytics dead-letter queue contains more than 100 failed events."
        labels:
          severity: warning
          team: analytics
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: analytics_worker_dlq_depth > 100
              intervalMs: 1000
              maxDataPoints: 43200

      - uid: pgxpool-exhaustion
        title: PgxpoolExhaustion
        condition: A
        for: 2m
        annotations:
          summary: "pgxpool acquired connections exceed 90"
          description: "PostgreSQL connection pool has more than 90 acquired connections."
        labels:
          severity: warning
          team: backend
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: backend_pgxpool_acquired_conns > 90
              intervalMs: 1000
              maxDataPoints: 43200
