services:
  # =========================================
  # 1. THE EDGE (Entrance)
  # =========================================
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - saas_net

  # The Logic (Modular Monolith)
  backend:
    build: ./app/backend-api
    restart: always
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://user:${DB_PASSWORD}@postgres:5432/saas_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - ENVIRONMENT=production
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      # Cloudflare R2 object storage
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY=${R2_ACCESS_KEY}
      - R2_SECRET_KEY=${R2_SECRET_KEY}
      - R2_BUCKET=${R2_BUCKET}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      # Paymob payment gateway
      - PAYMOB_API_KEY=${PAYMOB_API_KEY}
      - PAYMOB_INTEGRATION_ID=${PAYMOB_INTEGRATION_ID}
      - PAYMOB_IFRAME_ID=${PAYMOB_IFRAME_ID}
      - PAYMOB_HMAC_SECRET=${PAYMOB_HMAC_SECRET}
      # Transactional email via SMTP
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - GIN_MODE=release
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - saas_net

  # The Storefront (Next.js)
  frontend:
    build: ./app/frontend
    restart: always
    environment:
      - NODE_ENV=production
      - INTERNAL_API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=https://${ROOT_DOMAIN:-egyptcommerce.com}
    expose:
      - "3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - saas_net

  # =========================================
  # 3. DATA PERSISTENCE
  # =========================================
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: saas_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d saas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 12G
    networks:
      - saas_net

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data_prod:/data
    command: redis-server --save 60 1 --loglevel warning --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - saas_net

  # =========================================
  # 4. DATABASE MIGRATIONS (run-once job)
  # =========================================
  migrate:
    build: ./app/backend-api
    command: ["./backend", "migrate", "up"]
    environment:
      - DATABASE_URL=postgres://user:${DB_PASSWORD}@postgres:5432/saas_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate
    networks:
      - saas_net

  # =========================================
  # 5. OPERATIONS & SAFETY (Ops Stack)
  # =========================================

  # Auto-Backup to S3 (Daily at 3 AM)
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=saas_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    volumes:
      - db_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - saas_net

  # GUI Management (Portainer)
  portainer:
    image: portainer/portainer-ce:2.27.3
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - saas_net

  # Logs — Loki
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - saas_net

  # Logs — Promtail (ships container logs to Loki)
  promtail:
    image: grafana/promtail:3.4.2
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./config/promtail.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - saas_net

  # Metrics Dashboard (Grafana)
  grafana:
    image: grafana/grafana:11.6.0
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=https://monitor.${ROOT_DOMAIN:-egyptcommerce.com}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - saas_net

networks:
  saas_net:
    driver: bridge

volumes:
  pg_data_prod:
  redis_data_prod:
  db_backups:
  caddy_data:
  caddy_config:
  portainer_data:
  loki_data:
  grafana_data:
