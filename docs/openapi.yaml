externalDocs:
  description: Project API documentation notes
  url: ./API.md
info:
  contact:
    email: engineering@nexus-commerce.local
    name: Nexus Commerce Engineering
  description: |-
    Portfolio-ready internal OpenAPI specification for Nexus Commerce.

    This contract documents the complete backend route surface across commerce, operations, and platform modules.

    Highlights:
    - Multi-tenant architecture using X-Shop-ID scoping
    - JWT-based role-aware access (staff, customer, platform admin)
    - End-to-end commerce modules (catalog, cart, checkout, orders, returns)
    - Platform services (billing, subscriptions, analytics, AI, SEO, notifications)

    This spec is intended for internal engineering and portfolio demonstration.
  license:
    name: Proprietary - Internal Use
    url: https://nexus-commerce.local/license
  title: Nexus Commerce API
  version: "2026.03"
openapi: 3.0.3
security: []

paths:
  /api/v1/bootstrap:
    get:
      description: Aggregate endpoint for initial dashboard load
      operationId: getApiV1Bootstrap
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponseEnvelope'
          description: OK
      security:
        - bearerAuth: []
      summary: App Init
      tags:
        - App
  /api/v1/reference-data:
    get:
      description: Get all lookup constants
      operationId: getApiV1ReferenceData
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceDataResponseEnvelope'
          description: OK
      summary: Reference Data
      tags:
        - App
  /api/v1/catalog/products/bulk-archive:
    post:
      description: Archive multiple products
      operationId: postApiV1CatalogProductsBulkArchive
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkActionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
          description: OK
      security:
        - bearerAuth: []
      summary: Bulk Archive
      tags:
        - Catalog
  /api/v1/catalog/products/bulk-delete:
    post:
      description: Delete multiple products
      operationId: postApiV1CatalogProductsBulkDelete
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkActionRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
          description: OK
      security:
        - bearerAuth: []
      summary: Bulk Delete
      tags:
        - Catalog
  /api/v1/analytics/dashboard-summary:
    get:
      description: Aggregate overview for analytics dashboard
      operationId: getApiV1AnalyticsDashboardSummary
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryResponseEnvelope'
          description: OK
      security:
        - bearerAuth: []
      summary: Analytics Dashboard
      tags:
        - Analytics
  /api/v1/activity:
    get:
      description: Get recent activity feed; Staff only; Tenant-scoped
      operationId: getApiV1Activity
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderItemResponseListEnvelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
        - bearerAuth: []
          xShopId: []
      summary: Get recent activity feed
      tags:
        - Orders
  /api/v1/addresses:
    get:
      description: List customer addresses; Tenant-scoped
      operationId: getApiV1Addresses
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressResponseListEnvelope'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
