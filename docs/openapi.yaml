        data:
          $ref: '#/components/schemas/DashboardSummaryResponse'
        error:
          type: string
        meta:
          $ref: '#/components/schemas/GenericObject'
      type: object
    Envelope:
      description: Standard API envelope. Successful responses populate data/meta; failures populate error.
      properties:
        data:
          $ref: '#/components/schemas/GenericObject'
        error:
          type: string
        meta:
          $ref: '#/components/schemas/GenericObject'
      type: object
    ErrorResponse:
      description: Standard error payload returned by the API.
      example:
        error: validation failed
      properties:
        error:
          type: string
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
      type: object
    FieldError:
      properties:
        field:
          type: string
        message:
          type: string
      type: object
    GenericObject:
      additionalProperties: true
      description: Flexible object placeholder used where route-level DTOs are not yet expanded.
      type: object
    PaginationMeta:
      description: Standard pagination metadata for list endpoints.
      properties:
        current_page:
          type: integer
        limit:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean
      type: object

