components:
    schemas:
        Envelope:
            description: Standard API envelope. Successful responses populate data/meta; failures populate error.
            properties:
                data:
                    $ref: '#/components/schemas/GenericObject'
                error:
                    type: string
                meta:
                    $ref: '#/components/schemas/GenericObject'
            type: object
        ErrorResponse:
            description: Standard error payload returned by the API.
            example:
                error: validation failed
            properties:
                error:
                    type: string
            type: object
        GenericObject:
            additionalProperties: true
            description: Flexible object placeholder used where route-level DTOs are not yet expanded.
            type: object

        MessageResponse:
            properties:
                message:
                    type: string
            type: object
        StatusResponse:
            properties:
                status:
                    type: string
            type: object
