                phone:
                    type: string
                plan_name:
                    type: string
                shop_name:
                    type: string
                subdomain:
                    type: string
                timezone:
                    type: string
            required:
                - email
                - password
                - full_name
                - shop_name
                - subdomain
            type: object
        LoginRequest:
            properties:
