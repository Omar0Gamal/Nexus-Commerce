        error:
          type: string
        meta:
          $ref: '#/components/schemas/GenericObject'
      type: object
    ReferenceDataResponse:
      properties:
        countries:
          type: array
          items:
            type: string
        currencies:
          type: array
          items:
            type: string
        timezones:
          type: array
          items:
            type: string
        industries:
          type: array
          items:
            type: string
      type: object
    ReferenceDataResponseEnvelope:
      properties:
