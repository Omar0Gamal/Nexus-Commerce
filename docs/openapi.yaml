info:
    contact:
        email: engineering@nexus-commerce.local
        name: Nexus Commerce Engineering
    description: |-
        Portfolio-ready internal OpenAPI specification for Nexus Commerce.

        This contract documents the complete backend route surface across commerce, operations, and platform modules.

        Highlights:
        - Multi-tenant architecture using X-Shop-ID scoping
        - JWT-based role-aware access (staff, customer, platform admin)
        - End-to-end commerce modules (catalog, cart, checkout, orders, returns)
        - Platform services (billing, subscriptions, analytics, AI, SEO, notifications)

        This spec is intended for internal engineering and portfolio demonstration.
    license:
        name: Proprietary - Internal Use
        url: https://nexus-commerce.local/license
    title: Nexus Commerce API
    version: "2026.03"
